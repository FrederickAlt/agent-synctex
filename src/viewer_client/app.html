<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viewer Client</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;min-width:0;min-height:0;margin:0;overflow:hidden}
:root{--app-toolbar-height:36px;--app-toolbar-bg:rgb(34 38 45);--app-toolbar-border:rgb(18 21 26);--app-body-bg:rgb(212 212 215);--app-text:rgb(245 247 250);--app-muted:rgb(218 224 232);--app-tab-bg:rgb(39 44 52);--app-tab-hover:rgb(49 55 65);--app-tab-active:rgb(82 92 108);--app-accent:rgb(126 180 255)}
body{font:12px/1.35 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--app-body-bg);color:var(--app-text);position:fixed;inset:0}
#viewer-client-app{display:flex;flex-direction:column;width:100%;height:100vh;min-width:0;min-height:0;overflow:hidden}
header{display:none}
.titlebar-drag-region{align-self:stretch;flex:1 1 24px;min-width:8px;-webkit-app-region:drag}
header > .titlebar-drag-region:first-child{flex:0 0 0;min-width:0}
[role=tablist]{flex:1 1 auto;display:flex;align-items:center;gap:5px;min-width:0;max-width:100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;white-space:nowrap}
[role=tablist]::-webkit-scrollbar{display:none}
body[data-desktop-window=true] [role=tablist]{max-width:calc(100% - 78px)}
.tab-item{position:relative;display:flex;align-items:center;flex:0 1 240px;min-width:120px;max-width:360px;height:30px;background:var(--app-tab-bg);border:1px solid rgb(255 255 255 / .08);border-radius:7px;overflow:hidden;color:var(--app-text);-webkit-app-region:no-drag}
.tab-item:hover{background:var(--app-tab-hover)}
.tab-item.is-active{background:var(--app-tab-active);border-color:rgb(255 255 255 / .18);box-shadow:0 1px 2px rgb(0 0 0 / .22)}
button{font:inherit}
[role=tab],button[data-close-pdf-id]{border:0;color:inherit;background:transparent;cursor:pointer}
[role=tab]{flex:1 1 auto;min-width:0;max-width:100%;height:28px;padding:0 11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
[role=tab][aria-selected=true]{font-weight:600}
[role=tab][aria-selected=true]::before{content:"";position:absolute;inset-inline:8px;bottom:0;height:2px;border-radius:2px;background:var(--app-accent)}
button[data-close-pdf-id]{flex:0 0 26px;width:26px;height:26px;padding:0;border-radius:5px;color:var(--app-muted);line-height:24px}
button[data-close-pdf-id]:hover{background:rgb(0 0 0 / .08);color:var(--app-text)}
.tab-scroll-button{position:absolute;z-index:2;top:4px;display:flex;align-items:center;justify-content:center;width:24px;height:28px;padding:0;border:0;border-radius:999px;background:rgb(48 54 64);color:var(--app-muted);font-size:18px;line-height:1;cursor:pointer;-webkit-app-region:no-drag}
#tab-scroll-left{left:2px}
#tab-scroll-right{right:76px}
.tab-scroll-button:hover{background:rgb(58 65 76);color:var(--app-text)}
.tab-scroll-button[disabled]{visibility:hidden;pointer-events:none}
#titlebar-controls{display:none;align-items:center;gap:2px;-webkit-app-region:no-drag}
body[data-desktop-window=true] #titlebar-controls{display:flex}
.titlebar-control{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;padding:0;border:0;border-radius:999px;background:rgb(48 54 64);color:var(--app-muted);font-size:13px;line-height:1;cursor:pointer}
.titlebar-control:hover{background:rgb(58 65 76);color:var(--app-text)}
.titlebar-control.close{font-size:17px;font-weight:500;line-height:1}
.titlebar-control.close:hover{background:rgb(68 75 87);color:var(--app-text)}
#empty-state{flex:0 0 auto;margin:2rem;text-align:center;color:#555}
#empty-state[hidden]{display:none!important}
#viewer-panels{flex:1 1 auto;display:block;width:100%;height:100%;min-width:0;min-height:0;overflow:hidden}
[role=tabpanel]{display:block;width:100%;height:100%;min-width:0;min-height:0;overflow:hidden}
[role=tabpanel][hidden]{display:none!important}
iframe{display:block;width:100%;height:100%;min-width:0;min-height:0;border:0;background:white;vertical-align:top}
</style>
</head>
<body>
<main id="viewer-client-app">
<header data-window-drag-region>
<div class="titlebar-drag-region" data-window-drag-region></div>
<button id="tab-scroll-left" class="tab-scroll-button" type="button" title="Scroll tabs left" aria-label="Scroll tabs left" disabled>‹</button>
<nav id="tab-list" role="tablist" aria-label="Open PDFs"></nav>
<button id="tab-scroll-right" class="tab-scroll-button" type="button" title="Scroll tabs right" aria-label="Scroll tabs right" disabled>›</button>
<div class="titlebar-drag-region" data-window-drag-region></div>
<div id="titlebar-controls" aria-label="Window controls">
<button id="titlebar-minimize" class="titlebar-control" type="button" title="Minimize" aria-label="Minimize">−</button>
<button id="titlebar-maximize" class="titlebar-control" type="button" title="Maximize" aria-label="Maximize">□</button>
<button id="titlebar-close" class="titlebar-control close" type="button" title="Close" aria-label="Close">×</button>
</div>
</header>
<p id="empty-state">No PDF is open.</p>
<div id="viewer-panels"></div>
</main>
<script type="module" src="/assets/viewer-client-tabs.js"></script>
</body>
</html>
